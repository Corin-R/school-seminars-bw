services:
  frontend:
    build:
      context: frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 8080


  backend:
    build:
      context: backend
    ports: 
      - 8000:8000
    volumes: 
      - "./backend:/app"

